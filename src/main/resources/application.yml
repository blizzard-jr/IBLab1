spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/secure_api}
    username: ${DB_USERNAME:secure_api}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 16KB
app:
  jwt-secret: ${JWT_SECRET}
